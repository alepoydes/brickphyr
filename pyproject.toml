[project]
name = "brickphyrdev"
version = "0.2.0a1"
description = "Host tools for Brickphyr hubs"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["argcomplete>=3.6", "bleak>=3", "cbor2>=6.1", "hidapi>=0.15", "pybricksdev>=2.3.2", "pyserial>=3.5", "pyelftools>=0.29", "pyusb>=1.3", "smpclient[serial,ble]>=7.3", "tqdm>=4.67.1"]

[project.scripts]
brickphyrdev = "brickphyrdev.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "cmake>=3.20.5",
    "jsonschema>=4.26.0",
    "ninja",
    "packaging",
    "pykwalify",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.16,<1",
    "semver>=3",
    "west>=1.5",
    "smpmgr>=0.19.1",
]
sdk = ["patool>=2", "requests>=2.32.4", "tqdm>=4.67.1"]
flash = ["argcomplete>=3.6", "hidapi>=0.15", "tqdm>=4.67.1"]

[tool.uv.sources]
# The west manifest pins this editable workspace dependency.
pybricksdev = { path = "../pybricksdev", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
