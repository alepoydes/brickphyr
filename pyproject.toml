[project]
name = "brickphyr-tools"
version = "0.1.0"
description = "Build and verification tools for Brickphyr firmware"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "cmake>=3.20.5",
    "jsonschema>=4.26.0",
    "ninja",
    "packaging",
    "pyelftools>=0.29",
    "pykwalify",
    "pyserial",
    "pybricksdev",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.16,<1",
    "semver>=3",
    "west>=1.5",
]
sdk = ["patool>=2", "requests>=2.32.4", "tqdm>=4.67.1"]
flash = ["argcomplete>=3.6", "bleak>=3", "hidapi>=0.15", "pyusb>=1.3", "tqdm>=4.67.1"]

[tool.uv]
package = false

[tool.uv.sources]
# Coordinated local client changes; publication is tracked in docs/upstream.md.
pybricksdev = { path = "../pybricksdev", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
