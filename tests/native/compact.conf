# Match the Technic native memory limits; simulated peripherals still use RAM.
CONFIG_BRICKPHYR_APPLICATION_IMAGE_SIZE=4096
CONFIG_BRICKPHYR_APPLICATION_MEMORY_SIZE=13312
CONFIG_HEAP_MEM_POOL_SIZE=22528
# Exercise the fixed metadata budget through real protected thread creation.
CONFIG_KOBJECT_DATA_AREA_SIZE=1024
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
CONFIG_MAIN_THREAD_USERSPACE=n
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_UART_USERSPACE=n
CONFIG_GPIO_USERSPACE=n
CONFIG_SPI_USERSPACE=n
CONFIG_I2C_USERSPACE=n
CONFIG_ADC_USERSPACE=n
CONFIG_PWM_USERSPACE=n
CONFIG_WDT_USERSPACE=n
CONFIG_HWINFO_USERSPACE=n
