# SPDX-License-Identifier: Apache-2.0
description: Fake PWM with flags for paired motor outputs
compatible: "vnd,pup-test-pwm"
include: [pwm-controller.yaml, base.yaml]
properties:
  "#pwm-cells":
    const: 3
  frequency:
    type: int
    required: true
pwm-cells:
  - channel
  - period
  - flags
