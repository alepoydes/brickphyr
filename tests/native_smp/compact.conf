# RAM-only native services, including UART metadata. Peripheral mocks use extra
# MPS2 RAM; this fixture measures service stacks, not the board's total RAM.
CONFIG_BRICKPHYR_APPLICATION_IMAGE_SIZE=4096
CONFIG_BRICKPHYR_APPLICATION_MEMORY_SIZE=15872
CONFIG_BRICKPHYR_APPLICATION_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=25088
CONFIG_BRICKPHYR_NATIVE_FIXTURES=n
CONFIG_BRICKPHYR_MOTOR_CONTROL=n
CONFIG_BRICKPHYR_APP_STORAGE=n
CONFIG_MCUMGR_GRP_FS=n
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=n
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_METAKEYS=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HELP_OPT_PARSE=y
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_ARGC_MAX=32
CONFIG_SHELL_HISTORY_BUFFER=512
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=2560
CONFIG_MCUMGR_GRP_SETTINGS=y
CONFIG_MCUMGR_GRP_SETTINGS_ACCESS_HOOK=y
CONFIG_MCUMGR_GRP_SETTINGS_NAME_LEN=32
CONFIG_MCUMGR_GRP_SETTINGS_VALUE_LEN=32
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_STACK_USAGE=y
