CONFIG_BRICKPHYR_IMU=y
CONFIG_CORTEX_M_SYSTICK_64BIT_CYCLE_COUNTER=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
# IMU adds three discovery sources to the full peripheral fixture. Use the F4
# packet budget: its discovery reply exceeds 384 bytes; 512 needs six shell lines.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_SHELL_MTU=512
CONFIG_MCUMGR_TRANSPORT_SHELL_RX_BUF_COUNT=6
