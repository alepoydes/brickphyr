# Match the full BLE F4 shared heap for package/controller admission checks.
# Synthetic peripherals do not establish the physical board's available heap.
CONFIG_BRICKPHYR_PYTHON=y
CONFIG_HEAP_MEM_POOL_SIZE=223232
CONFIG_BRICKPHYR_APPLICATION_IMAGE_SIZE=65536
# Native limits must not inherit the independent 64 KiB Python arena size.
CONFIG_BRICKPHYR_NATIVE_MEMORY_SIZE=214144
CONFIG_BRICKPHYR_APPLICATION_STACK_SIZE=16384
