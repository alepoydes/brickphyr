# SPDX-License-Identifier: Apache-2.0
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_BRICKPHYR_NATIVE_FIXTURES=n
CONFIG_BRICKPHYR_SOUND=n
CONFIG_BRICKPHYR_BATTERY=n
CONFIG_BRICKPHYR_PORTS=n
CONFIG_BRICKPHYR_MOTORS=n
CONFIG_SHELL_BACKEND_DUMMY=n
CONFIG_BRICKPHYR_PYTHON=y
# Bluetooth, management and native-code publication exceed 16 thread objects.
CONFIG_MAX_THREAD_BYTES=3
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_BRICKPHYR_HOST_UART=y
CONFIG_UART_EMUL=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=n
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_SETTINGS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_SETTINGS_ACCESS_HOOK=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=384
CONFIG_MCUMGR_SMP_CBOR_MAX_MAIN_MAP_ENTRIES=24
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=524
CONFIG_BT_DATA_LEN_UPDATE=n
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n
# Controller calls are synthetic; this fixture has no real-time radio peer.
CONFIG_QEMU_ICOUNT=y
