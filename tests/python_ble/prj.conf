CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_BRICKPHYR_NATIVE_FIXTURES=n
CONFIG_BRICKPHYR_SOUND=n
CONFIG_BRICKPHYR_BATTERY=n
CONFIG_BRICKPHYR_PORTS=n
CONFIG_BRICKPHYR_MOTORS=n
CONFIG_SHELL_BACKEND_DUMMY=n
