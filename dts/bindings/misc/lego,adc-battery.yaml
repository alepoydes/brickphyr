# SPDX-License-Identifier: Apache-2.0
description: LEGO battery voltage, load current and optional 103AT thermistor
compatible: "lego,adc-battery"
include: base.yaml
properties:
  io-channels:
    required: true
  io-channel-names:
    required: true
    description: Separate 12-bit inputs named current and voltage, and optional temperature.
  chemistry:
    type: string
    required: true
    enum: [unknown, alkaline, li-ion]
    description: Fixed battery chemistry; use unknown when chemistry-gpios selects it.
  chemistry-gpios:
    type: phandle-array
    description: Optional connector input sampled at boot; active means alkaline, inactive Li-ion.
  current-raw-offset:
    type: int
    default: 0
    description: Nonnegative 12-bit offset added before scaling load current.
  current-full-scale-ma:
    type: int
    required: true
    description: Milliamps corresponding to 4096 ADC counts.
  voltage-full-scale-mv:
    type: int
    required: true
    description: Millivolts corresponding to 4096 ADC counts.
  voltage-correction-microohms:
    type: int
    required: true
    description: Measurement-path resistance compensated using measured current.
