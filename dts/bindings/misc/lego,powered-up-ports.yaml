# SPDX-License-Identifier: Apache-2.0
description: Powered Up electrical identification and shared logic supply
compatible: "lego,powered-up-ports"
include: base.yaml

properties:
  sync-timer:
    type: phandle
    description: F4 shared H-bridge PWM reset/update timer, owned by the port output driver
  vcc-gpios:
    type: phandle-array
    required: true
    description: Shared device logic supply enable, not motor power
  "#address-cells":
    const: 1
  "#size-cells":
    const: 0

child-binding:
  description: One external port; reg is its zero-based index (A is 0)
  include: pinctrl-device.yaml
  properties:
    pwms:
      type: phandle-array
      description: H-bridge PWM outputs in P1, P2 order, inverted on Prime F4
    uart:
      type: phandle
      description: UART controller used after electrical identification
    p1-gpios:
      type: phandle-array
      description: H-bridge P1 input; both low is coast, P1 high supplies positive P1
    p2-gpios:
      type: phandle-array
      description: H-bridge P2 input; paired with p1-gpios
    reg:
      type: int
      required: true
    p5-gpios:
      type: phandle-array
      required: true
    p6-gpios:
      type: phandle-array
      required: true
    tx-gpios:
      type: phandle-array
      required: true
    rx-gpios:
      type: phandle-array
      required: true
    buffer-gpios:
      type: phandle-array
      required: true
      description: Active-low UART buffer enable
