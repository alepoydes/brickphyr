# Optional BLE management; automatically advertises after boot.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SETTINGS=n
CONFIG_BT_DEVICE_NAME="Brickphyr"
# Full-size HCI commands in TI's service pack.
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y
CONFIG_PSA_CSPRNG_GENERATOR=y
# One computer management link and one application LEGO peer.
CONFIG_BT_MAX_CONN=2
CONFIG_BT_SMP=y
# Older LEGO peripherals use LE legacy pairing.
CONFIG_BT_SMP_SC_PAIR_ONLY=n
# Keep both live links' keys; replace unused bonds in RAM for the next peer.
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# Fit terminal writes and binary SMP fragments without increasing controller
# packets; Zephyr fragments ATT messages for the CC2564C's 27-byte ACL limit.
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_L2CAP_TX_MTU=130
CONFIG_BT_BUF_ACL_RX_SIZE=134
CONFIG_BT_DATA_LEN_UPDATE=n
CONFIG_MCUMGR_TRANSPORT_BT=y
# Application peer pairing must not change the existing host management access.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
# Request 7.5 ms while exchanging SMP; restore preferred idle intervals after
# the standard inactivity window. The central still chooses the actual interval.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MIN_INT=6
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MAX_INT=6
# BLE executes the same Settings/LittleFS path measured above 2 KiB on Shell.
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
