# SPDX-License-Identifier: Apache-2.0
# Optional BLE management; automatically advertises after boot.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SETTINGS=n
CONFIG_BT_DEVICE_NAME="Brickphyr"
# Full-size HCI commands in TI's service pack.
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y
CONFIG_PSA_CSPRNG_GENERATOR=y
CONFIG_BT_MAX_CONN=1
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
# BLE executes the same Settings/LittleFS path measured above 2 KiB on Shell.
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
