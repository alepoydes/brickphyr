# Combine with technic_hub_bluetooth.conf and its NPI overlay.
CONFIG_BRICKPHYR_NATIVE=y
CONFIG_LLEXT=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
CONFIG_LLEXT_HEAP_DYNAMIC=y
CONFIG_LLEXT_IMPORT_ALL_GLOBALS=y
CONFIG_LLEXT_EXPORT_DEFAULT_GROUPS=n
CONFIG_LLEXT_EDK=y
CONFIG_LLEXT_EDK_USERSPACE_ONLY=y
CONFIG_CURRENT_THREAD_USE_TLS=n
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_BRICKPHYR_IMU=y
CONFIG_BRICKPHYR_PORTS=y
CONFIG_BRICKPHYR_TELEMETRY=y
CONFIG_I2C_STM32_BUS_RECOVERY=y
CONFIG_I2C_STM32_TRANSFER_TIMEOUT_MSEC=10

# RAM upload and on-demand loader storage share one heap; no user-flash writes.
CONFIG_BRICKPHYR_APPLICATION_IMAGE_SIZE=4096
CONFIG_BRICKPHYR_APPLICATION_MEMORY_SIZE=12288
CONFIG_HEAP_MEM_POOL_SIZE=18432
# Firmware allocates through k_heap/LLEXT; SDK programs import only bp_api_v1.
# No retained firmware code uses libc malloc or its separate MPU arena.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
# IMU telemetry uses integers. Port metadata will select float formatting
# when UART devices are enabled; native SDK libc is linked independently.
CONFIG_CBPRINTF_FP_SUPPORT=n

# Loading/validation shares the existing Shell and SMP paths. Both must
# preempt a user application that never yields.
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=13
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=13
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_MCUMGR_SMP_CBOR_MAX_MAIN_MAP_ENTRIES=22
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y

# Bound generated kernel-object metadata independently of code-address hashing.
# Final link asserts that the actual table fits this capacity.
CONFIG_KOBJECT_DATA_AREA_SIZE=768
