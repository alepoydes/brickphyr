# SPDX-License-Identifier: Apache-2.0
# Optional HubNetwork Classic L2CAP alongside full Python and BLE management.
# Keep the measured Classic profile's shared-heap budget.
CONFIG_HEAP_MEM_POOL_SIZE=199808
# One computer management link, one BLE device, and three network peers.
CONFIG_BT_CLASSIC=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_BRICKPHYR_HUB_NETWORK=y
# 7-byte routing header + 513-byte message + 4-byte L2CAP header.
CONFIG_BT_BUF_ACL_RX_SIZE=524
