# One owner for the CDC data pipe. Shell output never enters the Pybricks stream.
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USBD_VREQ_SUPPORT=y
CONFIG_CONSOLE=n
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
# Observe every DTR edge before the next SET_CONTROL_LINE_STATE can change it.
CONFIG_USBD_MSG_DEFERRED_MODE=n
