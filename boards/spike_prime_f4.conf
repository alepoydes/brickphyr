# SPDX-License-Identifier: Apache-2.0
# One owner for the CDC data pipe. Shell output never enters the Pybricks stream.
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL_LOG_BACKEND=n
# Diagnostics has one retained sink and no runtime level controls.
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_LOG_MAX_LEVEL=2
# Share message packaging code; these warnings/errors are not a hot data path.
CONFIG_LOG_ALWAYS_RUNTIME=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USBD_VREQ_SUPPORT=y
CONFIG_CONSOLE=n
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_JESD216_API=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
# LittleFS receives caller buffers; Bluetooth crypto uses the shared system heap.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/settings/values"
# Boot filesystem work exceeds 1 KiB. Settings compaction nests filesystem
# metadata commits below Shell; give that complete call path a 4 KiB stack.
CONFIG_MAIN_STACK_SIZE=2048
# The 20 ms UI/power loop must yield to 833 Hz IMU acquisition (5) and
# the 5 ms port service (6), including their I/O completion wakeups.
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_SHELL_STACK_SIZE=4096
# Observe every DTR edge before the next SET_CONTROL_LINE_STATE can change it.
CONFIG_USBD_MSG_DEFERRED_MODE=n

# Standard SMP framing shares the management stream with the interactive shell.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_MCUMGR_GRP_SHELL=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_SETTINGS=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_SETTINGS_ACCESS_HOOK=y
