# Factory TI controller; no Zephyr Bluetooth stack or USB driver on this hub.
CONFIG_BRICKPHYR_CC2640_NPI=y
CONFIG_BRICKPHYR_CC2640_CONTROL=y
CONFIG_BRICKPHYR_CC2640_BLE=y
CONFIG_STACK_USAGE=y

# Shared Shell/serial SMP and the standard SMP BLE service.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_SETTINGS=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_SETTINGS_ACCESS_HOOK=y
