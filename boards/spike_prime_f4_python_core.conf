# Native Python, imports and REPL over the same supervisor and USB/BLE services.
CONFIG_BRICKPHYR_PYTHON=y
# Retain the 64 KiB execution arena and reuse RAM freed by the smaller library
# and connection profile for uploads, native Python code and device metadata.
CONFIG_HEAP_MEM_POOL_SIZE=144384
CONFIG_BRICKPHYR_APPLICATION_IMAGE_SIZE=32768
CONFIG_BRICKPHYR_APPLICATION_MEMORY_SIZE=65536
CONFIG_BRICKPHYR_PYBRICKS=n
CONFIG_BRICKPHYR_PYBRICKS_EXECUTION=n
