# Native Python, imports and REPL over the same supervisor and USB/BLE services.
CONFIG_BRICKPHYR_PYTHON=y
# Reclaim the former 64 KiB Python reservation and the smaller library/profile
# savings for on-demand arenas, stacks, uploads, code and device metadata.
# Budget linked services, including capture and SMP, before reserving this heap.
CONFIG_HEAP_MEM_POOL_SIZE=217600
CONFIG_BRICKPHYR_APPLICATION_IMAGE_SIZE=32768
CONFIG_BRICKPHYR_PYTHON_HEAP_SIZE=65536
CONFIG_BRICKPHYR_PYBRICKS=n
CONFIG_BRICKPHYR_PYBRICKS_EXECUTION=n
