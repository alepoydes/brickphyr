# Initial board profile: no runtime BLE transport yet, and no USB on this hub.
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_LOG_BACKEND=n
# Diagnostics has one retained sink and no runtime level controls.
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_LOG_MAX_LEVEL=2
# Share message packaging code; these warnings/errors are not a hot data path.
CONFIG_LOG_ALWAYS_RUNTIME=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7
