CONFIG_BRICKPHYR_NATIVE=y
CONFIG_LLEXT=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
CONFIG_LLEXT_HEAP_SYSTEM=y
CONFIG_LLEXT_IMPORT_ALL_GLOBALS=y
CONFIG_LLEXT_EXPORT_DEFAULT_GROUPS=n
CONFIG_LLEXT_EDK_USERSPACE_ONLY=y
# Keep the three dynamic MPU regions for text/constants, data and BSS.
# Native images have no TLS; user entry queries its thread ID through SVC.
CONFIG_CURRENT_THREAD_USE_TLS=n
# F4 SRAM has no reserved prefix; keep static user stacks before ordinary data.
CONFIG_USERSPACE_STACKS_EARLY=y
# Shared by connected-device state, uploads and native loader allocations.
# Fit linked state, including capture/management and the storage worker.
# Python profiles override this shared-heap budget.
CONFIG_HEAP_MEM_POOL_SIZE=224768
# Larger binary recording blocks amortize SMP requests over BLE. Four buffers
# retain the existing request/response capacity, using 2 KiB more than 512-byte
# buffers; the shared-heap budgets account for that fixed transport cost.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
CONFIG_BRICKPHYR_APPLICATION_IMAGE_SIZE=65536
CONFIG_BRICKPHYR_NATIVE_MEMORY_SIZE=214144
CONFIG_BRICKPHYR_APPLICATION_STACK_SIZE=16384
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
# Permission storage covers firmware threads and the protected application.
CONFIG_MAX_THREAD_BYTES=3
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
# Essential services must preempt a native busy loop without relying on slices.
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=13
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=13
# Application status includes resource accounting and supported formats.
CONFIG_MCUMGR_SMP_CBOR_MAX_MAIN_MAP_ENTRIES=24
CONFIG_BRICKPHYR_APP_STORAGE=y
# Startup mounts LittleFS and loads user data on the main stack. Keep the
# filesystem-call budget even though saves now run on the storage worker.
CONFIG_MAIN_STACK_SIZE=4096
# ELF validation nests filesystem reads on the SMP worker.
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y
