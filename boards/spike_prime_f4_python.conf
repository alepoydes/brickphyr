# SPDX-License-Identifier: Apache-2.0
# Add to the native profile: both engines use the same application supervisor.
CONFIG_BRICKPHYR_PYTHON=y
# Reclaim the former 64 KiB Python reservation and Classic stack capacity into
# the shared heap. Active engines allocate arenas, native regions and stacks
# alongside uploads. The optional Classic fragment sets its smaller budget.
CONFIG_HEAP_MEM_POOL_SIZE=223232
CONFIG_BRICKPHYR_APPLICATION_IMAGE_SIZE=65536
CONFIG_BRICKPHYR_PYTHON_HEAP_SIZE=65536
