# SPDX-License-Identifier: Apache-2.0
# Add to the native profile: both engines use the same application supervisor.
CONFIG_BRICKPHYR_PYTHON=y
# The 16 KiB MPU-aligned application stack leaves a layout gap. An 80 KiB
# shared heap fits while retaining the stack and 64 KiB execution arena.
CONFIG_HEAP_MEM_POOL_SIZE=81920
# Keep metadata padding below the next 16 KiB MPU stack boundary in the full
# image. The final linker still checks the complete generated object table.
CONFIG_KOBJECT_DATA_AREA_RESERVE_EXTRA_PERCENT=50
# HubNetwork uses Classic L2CAP alongside BLE management and one BLE device.
CONFIG_BT_CLASSIC=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
# 7-byte routing header + 513-byte message + 4-byte L2CAP header.
CONFIG_BT_BUF_ACL_RX_SIZE=524
