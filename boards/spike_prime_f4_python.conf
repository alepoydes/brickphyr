# SPDX-License-Identifier: Apache-2.0
# Add to the native profile: both engines use the same application supervisor.
CONFIG_BRICKPHYR_PYTHON=y
# Keep the 16 KiB user stack and 64 KiB execution arena; remaining capacity
# serves shared uploads, native code and device metadata.
CONFIG_HEAP_MEM_POOL_SIZE=118272
CONFIG_BRICKPHYR_APPLICATION_IMAGE_SIZE=32768
CONFIG_BRICKPHYR_APPLICATION_MEMORY_SIZE=65536
# HubNetwork uses Classic L2CAP alongside BLE management and one BLE device.
CONFIG_BT_CLASSIC=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
# 7-byte routing header + 513-byte message + 4-byte L2CAP header.
CONFIG_BT_BUF_ACL_RX_SIZE=524
